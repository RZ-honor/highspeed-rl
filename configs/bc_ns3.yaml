# Stage1 BC 预训练配置（用于初始化 NS-3 Stage2 在线微调）
#
# 与 configs/default.yaml 的 14 维观测一致（obs_dim=14，无负载特征），
# 观测布局与 src/envs/ns3_env.py 的 14 维 obs 完全对齐（同序、同归一化），
# 因此 bc_init.pt 可直接加载到 NS-3 后端的 hybrid 网络。
# 顶层 net_kwargs 必须与 configs/ns3.yaml 完全一致（ode_steps=2/ode_hidden=64）。
device: auto
seed: 42

channel:
  # 射频与 NS-3 后端对齐（configs/ns3.yaml ns3.args：earfcn=100 band1 2.1GHz、43dBm、NF7）
  # 及 hsr_load.yaml 标定：定向面板 15dBi + 车顶 3dBi、只计最强 3 个干扰源
  fc_hz: 2100000000.0
  bw_hz: 20000000.0
  bs_tx_power_dbm: 43
  bs_height_m: 35
  ue_height_m: 1.5
  noise_figure_db: 7
  reuse: 1
  n_interferers: 3
  street_width_w: 5
  building_height_h: 5
  shadow_sigma_los: 4.1
  shadow_sigma_nlos: 6.9
  d_corr_los: 37
  d_corr_nlos: 120
  jakes_n_rays: 34
  penetration_db: 28
  bs_antenna_gain_dbi: 15
  ue_antenna_gain_dbi: 3

mobility:
  speed_mps: 83.3
  dt_s: 0.1
  # Python RMa 路损比 NS-3 Friis 保守，站间距按 hsr_load 标定取 500-800m
  # （NS-3 为确定性 1000m）；2.1GHz + 18dBi 天馈下覆盖连续
  bs_spacing_min_m: 500
  bs_spacing_max_m: 800
  bs_offset_min_m: 50
  bs_offset_max_m: 100
  n_bs: 12
  # 隧道段与 NS-3 场景候选段对齐（configs/ns3.yaml ns3.scenario.tunnels），
  # 让 A3 教师示范覆盖「隧道前提前切换」工况。
  tunnels:
    - {x_start: 2000, x_end: 2800, extra_loss_db: 25}
    - {x_start: 5000, x_end: 5600, extra_loss_db: 25}

env:
  episode_steps: 500
  obs_dim: 14
  n_actions: 7
  ho_interruption_ms_min: 12
  ho_interruption_ms_max: 40
  dual_setup_ms: 10
  rlf_sinr_db: -6
  # HSR 标定（与 configs/hsr_load.yaml 一致）：
  # T310=1000ms → 10 步；Jakes 快衰落下单步深衰落(SINR 可到 -25dB)不应判 RLF。
  # default 的 3 步(300ms) 使 episode 在首个深衰落即终止，A3 教师来不及示范任何切换。
  rlf_consecutive_steps: 10
  rlf_fallback_sinr_db: -5
  # 弱覆盖预警（设计方案 §2.3，与 default.yaml 同口径）
  w_outage: 0.6
  weak_coverage_sinr_db: -2.0
  # RLF 按剩余步数计罚（不足则退化为「永不切换」策略）
  rlf_drop_penalty: 1.0
  rlf_termination_penalty: 10.0
  # 应急兜底需持续 8 步(800ms) 才触发（L3 滤波口径），成为真正的最后手段
  fallback_persist_steps: 8
  # 关闭预防性回落：BC 示范的动作标签必须来自 A3 教师自身决策，
  # env 抢先兜底会让 (obs, teacher_action) 标签与实际转移不一致。
  preempt_rsrp_dbm: -200.0
  preempt_margin_db: 999.0
  w_throughput: 0.5
  w_handover: 0.3
  w_delay: 0.1
  w_stability: 0.1
  ho_penalty: 3.0
  pingpong_penalty: 5.0
  stability_bonus: 0.5
  buf_arrival_kbps: 5000.0

safety:
  min_target_rsrp_dbm: -110
  max_drop_vs_serving_db: 6
  pingpong_block_steps: 2
  rlf_fallback_sinr_db: -5
  mask_dual: true        # LTE LENA 无 EN-DC：屏蔽 dual/triple，与 ns3_env 处理一致

# A3 运营商级教师参数（与 configs/hsr_load.yaml 标定一致）
a3_operator:
  hyst_db: 2.0
  ttt_ms: 320
  a3_offset_db: 3.0
  doppler_adaptive: true

agent:
  gamma: 0.99
  lr: 1.0e-3
  hidden_dim: 128
  batch_size: 64
  buffer_size: 10000
  eps_start: 1.0
  eps_end: 0.01
  eps_decay: 0.995
  target_sync_steps: 100
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0
  per_epsilon: 1.0e-6

training:
  n_episodes: 500
  warmup_steps: 3
  checkpoint_dir: checkpoints_ns3
  checkpoint_freq: 1

eval:
  n_episodes: 10

# 必须与 configs/ns3.yaml 的顶层 net_kwargs 完全一致
net_kwargs:
  ode_steps: 2
  ode_hidden: 64
  dt_s: 0.1

hybrid:
  ode_steps: 8
  ode4_hidden: 32
