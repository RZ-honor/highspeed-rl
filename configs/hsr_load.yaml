# 高铁多用户负载场景（整列车数百 UE 并发 + 350km/h + 隧道群）
#
# 现实依据：复兴号 16 编组定员约 1200 人，单小区常驻活跃 UE 200-600。
# 整列车穿过时，所有 UE 共享同一基站的 RB 资源 → 单用户吞吐被均分稀释。
# 业务混合：视频/网页/即时消息/游戏，突发请求。
#
# 此场景检验：在高负载下「切到轻载小区」的价值远高于空载场景，
# 负载感知切换是 RL 相对固定门限 A3 的结构性优势（A3 只看 RSRP，不看负载）。

device: auto
seed: 42

channel:
  fc_hz: 2100000000.0
  bw_hz: 20000000.0
  bs_tx_power_dbm: 43
  bs_height_m: 35
  ue_height_m: 1.5
  noise_figure_db: 7
  reuse: 1
  # 定向天线可见干扰源数：高铁沿轨定向覆盖，列车实际只看见邻近 2~4 个小区。
  # 默认 3（服务小区两侧各 1~2 个）。设 0 或不设则退化为全量 reuse-1 干扰。
  n_interferers: 3
  street_width_w: 5
  building_height_h: 5
  shadow_sigma_los: 4.1
  shadow_sigma_nlos: 6.9
  d_corr_los: 37
  d_corr_nlos: 120
  jakes_n_rays: 34
  penetration_db: 28
  # 天线增益（与 hsr_stress 一致）：沿轨定向面板 15dBi + 车顶天线 3dBi
  bs_antenna_gain_dbi: 15
  ue_antenna_gain_dbi: 3

mobility:
  speed_mps: 97.2          # 350 km/h
  dt_s: 0.1
  bs_spacing_min_m: 500
  bs_spacing_max_m: 800
  bs_offset_min_m: 50
  bs_offset_max_m: 100
  n_bs: 12
  # 实网隧道有漏泄电缆覆盖，额外损耗取 12-15dB（入口突变仍足以诱发乒乓）
  tunnels:
    - {x_start: 1200, x_end: 1700, extra_loss_db: 12}
    - {x_start: 3100, x_end: 3500, extra_loss_db: 15}
    - {x_start: 5200, x_end: 5900, extra_loss_db: 12}

# ---- 多用户负载建模 ----
load:
  enabled: true
  n_ue_per_cell: 60        # 单小区并发活跃 UE（调度器每 TTI 调度 subset）
  # 关键标定：使「小区负载」成为吞吐的绑定约束，而非业务需求。
  # fair_share = 150/n_ue ∈ [150/90, 150/30] = [1.67, 5.0] Mbps（load_variation=0.5）
  # demand*burst = 2.0*2.0 = 4.0 Mbps 为需求上限
  # → n_ue=30 时需求受限(4.0)，n_ue=60/90 时负载受限(2.5/1.67)
  # 这样「切到轻载小区」才产生真实吞吐差异，RL 的负载感知才有价值。
  cell_capacity_mbps: 150.0
  per_ue_demand_mbps: 2.0   # 每 UE 业务需求（视频/网页混合）
  burst_factor: 2.0         # 突发倍数上限
  load_variation: 0.5       # 小区间负载差异 ±50%（车站/隧道口更拥塞）

env:
  episode_steps: 600
  # 16 维 = 14 维基础观测 + 2 维负载特征（obs[14] 服务拥塞度、
  # obs[15] 最强邻与服务的拥塞度差）。没有这两维时负载不可观测，
  # 「负载感知切换」在原理上不可能被学到。
  obs_dim: 16
  obs_load_features: true
  n_actions: 7
  ho_interruption_ms_min: 12
  ho_interruption_ms_max: 40
  dual_setup_ms: 10
  rlf_sinr_db: -6
  rlf_consecutive_steps: 10   # 3GPP T310=1000ms → 10 步
  preempt_rsrp_dbm: -200.0   # 关闭预防回落（保留RL学到的策略）
  preempt_margin_db: 999.0
  rlf_fallback_sinr_db: -5
  # 应急兜底需持续满足的步数（L3 滤波）。
  # 设 1 时单次深衰落即触发 → 兜底约 40 次/episode，把策略决策完全架空。
  # 取 8 步(800ms)，逼近 T310=1000ms，使其成为真正的最后手段。
  fallback_persist_steps: 8
  # 应急兜底需持续满足的步数（L3 滤波）。
  # 设 1 时单次深衰落就触发 → 兜底 ~40 次/episode，把策略决策完全架空。
  # 取 8 步(800ms)，逼近 T310=1000ms，使其成为真正的最后手段。
  fallback_persist_steps: 8
  w_throughput: 0.5
  w_handover: 0.3
  w_delay: 0.1
  w_stability: 0.1
  # 弱覆盖/中断惩罚：纠正 RL 过度保守（赖在劣化小区）
  w_outage: 0.6
  weak_coverage_sinr_db: -2.0
  # RLF 断链代价：按剩余步数计（防止「永不切换」退化策略）
  rlf_drop_penalty: 1.0
  rlf_termination_penalty: 10.0
  ho_penalty: 3.0
  pingpong_penalty: 5.0
  stability_bonus: 0.5
  potential_shaping_weight: 2.0
  buf_arrival_kbps: 5000.0

safety:
  min_target_rsrp_dbm: -110
  max_drop_vs_serving_db: 6
  pingpong_block_steps: 2
  rlf_fallback_sinr_db: -5
  # 屏蔽 dual/triple（3/4/6）：LTE LENA 无 EN-DC，且会让吞吐被两条链路
  # Shannon 相加而虚增。与 ns3_env 的处理保持一致。
  mask_dual: true
  # 应急兜底需持续满足的步数（L3 滤波）。
  # 设 1 时单次深衰落就触发 → 兜底 ~40 次/episode，把策略决策完全架空。
  # 取 8 步(800ms)，逼近 T310=1000ms，使其成为真正的最后手段。
  fallback_persist_steps: 8

# 网络构造参数（顶层 net_kwargs，所有网络工厂共享签名；不用的键被忽略）
# ode_steps = 每个 env 步(100ms)内部的 RK4 子步数（非伪时间切分数）
net_kwargs:
  ode_steps: 2
  ode_hidden: 64
  dt_s: 0.1

agent:
  gamma: 0.99
  lr: 5.0e-4
  hidden_dim: 128
  batch_size: 64
  buffer_size: 20000
  eps_start: 1.0
  eps_end: 0.01
  eps_decay: 0.997
  target_sync_steps: 100
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0
  per_epsilon: 1.0e-6
  # n 步回报（设计方案 §4.3 P2）：切换/中断后果延迟数步才显现，1 = 关闭
  n_step: 3
  # 潜变量动力学：多步外推预测损失（horizon=10 步 = 1s）
  dynamics:
    enabled: true
    weight: 0.5
    burn_in: 6
    horizon: 10
    batch_size: 16
    episode_capacity: 200
    every: 6              # BPTT 开销大，每 6 个 learn 步算一次

training:
  n_episodes: 800
  warmup_steps: 3
  checkpoint_dir: checkpoints_hsr_load
  checkpoint_freq: 20

eval:
  n_episodes: 10

hybrid:
  ode_steps: 8
  ode4_hidden: 32

a3_operator:
  hyst_db: 2.0
  ttt_ms: 320
  a3_offset_db: 3.0
  doppler_adaptive: true
