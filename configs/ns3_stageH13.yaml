# 课程阶段 H13：族=['normal', 'tunnel', 'load', 'congested', 'hotcold'], randomize=True
#
# 与 H11 的**唯一**差异：两个奖励键 —— 提高「不切换」的定价。
#
# 立项依据（cmd_0186，2026-09-30）：H11 在门禁③ 的 load 族掉话，16 集死 4 集
#   （survival=0.75，与 cmd_0184 逐位复现）。死因分类 4/4 全部是
#   no_ho_while_a3_would —— A3 在同一状态下会切，RL 不动，链路拖到 SINR -6.5
#   后终止。存活集 ho_total=4，死亡集只有 3，且死前 30 步 rl_ho=0 / a3_ho=8。
#
# 根因是**定价不对称**：
#     切换成本        = ho_penalty 3.0 × w_handover 0.3 = 0.9（一次性）
#     不切换的代价    = w_gap 0.05/步（邻区更好却不切）
#                     + 弱覆盖预警（仅在 -2 → -6 dB 这 4 dB 内，最大 0.6）
#   ⇒ 赖着不动比切一次便宜近 20 倍，且致命后果在 129 步之外（γ=0.99 折现后
#     信号很弱）。RLF 惩罚本身不轻（实测死在 step 442 → 1.0×38 + 10 = 48，
#     rlf_remaining_cap_steps=60 未触发），问题是**来得太晚**。
#
# 本轮改动（均在 env 段）：
#   w_gap                 0.05 → 0.3   补上「该切没切」的单步定价
#   weak_coverage_sinr_db -2.0 → 0.0   把预警提前，让梯度远离 RLF 才出现
#
# 刻意保持不变（可归因）：w_outage / ho_quality_w / ho_penalty / w_handover /
#   rlf_*；safety.enable 仍为 false（不开 RuleGuard，避免把「策略变好」与
#   「被安全层兜住」混在一起）。
#
# ⚠ 关于是否需要重跑 Stage1 BC：**不需要**。本轮只改奖励权重，不动 obs_dim、
#   归一化（load_norm_denom 仍 32.0）与观测口径，而 BC 学的是动作克隆、不依赖
#   奖励。此判断需显式记录 —— 项目在 F4 与 load_norm_denom 上栽过两次
#   「改口径未同步重跑」的跟头。
#
# 判据（双向）：
#   ① 主判据：load 族 16 集（diag_death_probe，与 paired_matrix 同口径）
#      survival = 1.00 且 no_ho_* 出现 0 次；
#   ② 不劣判据：M1–M8 保住 H11 的 p95 增益，且 ho/km、pingpong 不因定价调整
#      而反弹（过度切换）。
# ---------------------------------------------------------------------------
# 课程阶段 H11：族=['normal', 'tunnel', 'load', 'congested', 'hotcold'], randomize=True
#
# 与 H10 的**唯一**差异：冻结锚点从 checkpoints_stageG4/bc_init.pt 改为
# checkpoints_stageH8/best.pt —— 即**锚点与训练起点对齐**。
#
# 依据（2026-09-25 决定性证据）：H8 自己的启动参数是
#     --init checkpoints_stageG4/best.pt   --anchor-init checkpoints_stageG4/bc_init.pt
#   ⇒ 起点与锚点**同族**（都是 G4：best 训练、bc_init 是它的 BC 教师克隆）。
#   而 H9/H10 用的是
#     --init checkpoints_stageH8/best.pt   --anchor-init checkpoints_stageG4/bc_init.pt
#   ⇒ **锚点（G4 bc_init）正是 H8 训练前的起点，即比训练起点更差的策略**。
#   于是 bc_anchor_w=0.02 的信任域持续把 Q 从 H8 的更优解往回拉向 G4 的旧策略：
#     * 外部验收 M2/M7 上 H9 与 H10 结果**逐位相同**（都收敛到锚点邻域）；
#     * 时延 p95 全面劣于 H8（M2 +46%、M5 +27%、M7 +31%），吞吐却没换来。
#   H10 已修好 eval 盲区 / 回放池过学 / 评估预算三处，仍退化 ⇒ 根因在锚点。
#
# 与 F4 教训的关系（不是矛盾）：F4 是「起点与锚点都是 C4，但 C4 只训过
# normal+tunnel，对新分布不适用」；这里的问题是**锚点比起点差**。
# 两条合起来就是 F5 那句判据的准确用法：锚点必须是**在目标分布上本身成立、
# 且不劣于训练起点**的策略。续训阶段最安全的选择就是锚点 = 起点。
# 由 session_logs/make_stage_cfg.py 生成；晋级判据：内联 eval out < 0.5
# NS-3 后端训练配置（Stage C，云端 T4）
#
# 用法：
#   python -m scripts.train_ns3 --config configs/ns3.yaml --device cuda --net hybrid
#
# ns3.binary 为 hsr-rl 构建产物路径。release 构建比 debug 快数倍，推荐：
#   cd /workspace/ns3 && ./ns3 configure -d release && ./ns3 build hsr-rl
#   → build/scratch/ns3-dev-hsr-rl/release/hsr-rl
# debug 构建路径：build/scratch/ns3-dev-hsr-rl/debug/hsr-rl

device: cuda
seed: 42

channel:
  fc_hz: 3500000000.0
  bw_hz: 20000000.0
  bs_tx_power_dbm: 43
  bs_height_m: 35
  ue_height_m: 1.5
  noise_figure_db: 7

mobility:
  speed_mps: 83.3
  dt_s: 0.1

env:
  backend: ns3
  episode_steps: 480        # 48s（首个决策点在 0.3s）
  obs_dim: 28
  extended_obs: true
  # 负载/隧道观测（设计文档 P1-6，需 NS-3 侧新版 HsrState：占用原 reserved[5]，
  # 协议尺寸仍为 56B，故旧二进制也能跑——只是读到 0，故默认关闭以保兼容）。
  # 开启时 obs_dim 需为 28（23 + 负载 4 + 隧道 1），且必须先重编 NS-3。
  load_obs: true
  # 96.0 → 32.0（2026-09-24 回退）：denom 是**观测归一化尺度**，改它等于改观测
  # 语义 ⇒ 训练起点（H8 best.pt）与冻结锚点（G4 bc_init.pt）都是在 denom=32 下
  # 训出来的，用 96 会让 4 个负载维缩到 1/3 尺度、输入分布偏移，锚点被钉在一个
  # 对新口径不成立的策略上（F4 教训；两次 BC 同口径重跑也都失败）。
  # 必要性也不成立：S2 全矩阵实测 load_sat_ratio = 0%（N≤128 时每小区仅 4~16 UE，
  # 够不到 32），且本阶段 congested/hotcold 已回退到 [32,64]。结论：规模没到就不要
  # 为"将来可能饱和"提前改口径（见 session_logs/make_stage_cfg.py 的 H9 注释）。
  load_norm_denom: 32.0   # 14 维基础 + 9 维扩充；false 可回到旧口径做 A/B  # NS-3 后端：14 维基础 + 9 维扩充（n3/候选SINR/隧道/RLF计时/in-cell/guard/测量有效性）
  n_actions: 7
  # ---- 权重口径（路径 A：主项改用可预测的覆盖/SINR）----
  # 吞吐实测值强噪声（CV≈1.12、45% 步接近 0）且随未观测负载漂移（同 SINR
  # 下族间差 2.5 倍）⇒ 由主项降为**次要项**（0.5 → 0.15），仍保留 EMA 平滑
  # 与 episode 基线以控制残余方差。
  w_throughput: 0.15
  w_handover: 0.3
  w_delay: 0.1
  w_stability: 0.1
  # 覆盖质量（主项）：服务链路 SINR 相对 RLF 门限的裕度，−w…+w。
  # G-Form 已证明该量可预测（外推 MAE 1.31dB）且跨族可泛化（×1.00~1.46）。
  w_coverage: 0.15
  coverage_good_sinr_db: 10.0
  # 目标差距项：邻区明显更好却不切 → 小罚（教「切向更好的小区」）
  w_gap: 0.3               # H13: 0.05→0.3  补「邻区更好却不切」的单步定价（原值与切换成本 0.9 差近 20 倍）
  coverage_gap_scale_db: 15.0
  # ---- 显式负载项（机制审计驱动）----
  # 负载可观测化后 RL 增益随负载递增，但审计显示时间均值负载几乎不变 ⇒
  # 增益来自切换时机而非负载分流，根因是奖励里没有直接给「避开拥塞」的梯度。
  # w_load：待在比最轻的有效邻区更拥挤的小区时的惩罚（0 = 关闭）。
  # deadband：允许多带 1 个背景 UE（避免负载噪声引发的乒乓）。
  w_load: 0.0
  load_gap_scale_ue: 4.0
  load_gap_deadband_ue: 1.0
  ho_penalty: 3.0
  pingpong_penalty: 5.0
  stability_bonus: 0.5
  rlf_sinr_db: -6
  rlf_consecutive_steps: 3
  rlf_fallback_sinr_db: -5
  # RLF 兜底持续性（对标 L3 测量滤波）：单次深衰落不得触发切换
  fallback_persist_steps: 8
  # 预防性回落（三级安全层 §2.4，与 default.yaml 同口径）
  preempt_rsrp_dbm: -105.0
  preempt_margin_db: 4.0
  # ---- 以下三项此前只在 default.yaml 补齐，NS-3 侧缺失会让 ns3_env 取到
  # w_outage=0（弱覆盖预警完全关闭）——这正是 Stage2 前期学到「永不切换」
  # 退化策略的温床。现按 default.yaml 同口径补齐（设计方案 §2.3）。
  # 弱覆盖预警项：覆盖质量项（w_coverage）已给出连续、可预测的同向信号，
  # 这里保留为「接近 RLF 门限」的锐化惩罚，权重相应下调（0.6 → 0.3）。
  w_outage: 0.3
  weak_coverage_sinr_db: 0.0  # H13: -2.0→0.0  预警提前；原值只在 -2→-6 dB 生效，等罚起来时离 RLF 只剩几步
  # RLF 终止按**剩余步数**计罚：RLF 惩罚 = drop*remaining + termination，
  # 避免 agent 发现「一次固定小罚 + 永不切换」比正常切换更划算。
  rlf_drop_penalty: 1.0
  rlf_termination_penalty: 10.0
  # RLF 计罚按「剩余步数」线性增长；全灭分布下每集都是数百量级的同款
  # 负数 → Q 无区分度、PER 又放大灾难样本。封顶后「早死」仍明显劣于
  # 「活到最后」（60×1+10 vs 正常集的正收益），但梯度不被淹没。
  # 0 = 不封顶（旧行为）。
  rlf_remaining_cap_steps: 60
  # 洞口数据面塌陷兜底：口部 dl≈0 而宏站 RSRP 仍有 -62dBm，SINR 路径不开火。
  # 此前 ns3.yaml 缺此键（默认 0 = 关闭），训练侧比评估侧少一条兜底。
  fallback_tp_collapse_mbps: 0.1
  # ---- 切换质量即时惩罚（诊断驱动）----
  # 切换后 window 步内，新链路 SINR 每比切换前低 1dB 就按 w 扣一次、
  # 分摊到 window 步（第一步即带负奖励）。这让「切向更弱小区」在**一步内**
  # 可学，不必等几十步后的 RLF。0 = 关闭。
  # 0.2：最坏情况（比切换前低 20dB）每步 -0.4、累计 -4.0/次错误切换，
  # 相对单步吞吐奖励（≈1.7）足够显著，又不至于盖过 RLF 主惩罚。
  ho_quality_w: 0.2
  ho_quality_window_steps: 10
  ho_quality_max_drop_db: 20.0
  buf_arrival_kbps: 5000
safety:
  min_target_rsrp_dbm: -110
  max_drop_vs_serving_db: 6
  pingpong_block_steps: 2
  rlf_fallback_sinr_db: -5
  # strict = 每步都按规则掩码（历史行为）；guard = 默认放行给 RL 探索，
  # 只有当 RL 退化到比规则差时才让规则接管（见 src/agents/safety.RuleGuard）。
  # 取 strict 的代价是评估中 79.3% 决策被 masked_weak 改写成 stay、ho=0。
  mode: guard

# 规则门禁参数：滚动比较「RL 主导回合」与「A3 教师回合」的平均收益
guard:
  enable: false
  window_episodes: 8      # 每侧最多取最近多少集成绩做一次比较
  min_episodes: 2         # 每侧至少几集才触发比较（不足则维持放行）
  margin: 0.0             # RL 需低过规则 margin×|R_rule| 才算退化（0 = 落后即接管）
  release_comparisons: 3  # 连续几次比较 RL 已追平规则才释放接管（滞回，防抖动）

agent:
  gamma: 0.99
  # 1e-3 → 3e-4：BC 初始化后 Q 是 logit 量级、TD 目标却是回报量级，
  # 初期 TD 误差巨大。降 lr 配合（已存在的）grad-clip 与 Q 尺度校准，
  # 避免把 BC 学到的动作排序一次性冲掉。
  lr: 1.0e-4
  hidden_dim: 128
  # ---- 按真实配额重算（2026-09-25）----
  # ⚠ 此前的容量判断全错在一点：`nproc` 报 32，但 cgroup 的
  #    /sys/fs/cgroup/cpu.max = 700000/100000 ⇒ **CPU 配额只有 7 核**；
  #    memory.max = 60 GiB，而实际只用了 4.7 GB；DCU 16G 全程 VRAM 0% / DCU 0%。
  #    所以「数据供给是节流阀 / DCU 0%」的真因是**20 路 ns-3 跑在 7 核上
  #    （2.9× 超额订阅）**，不是 NS-3 锁步等待。
  batch_size: 1024
  #   原 256 → 1024：DCU 16G 完全空闲，扩大 batch 降梯度方差、提样本效率，
  #   墙钟几乎不增加（DCU 侧不是瓶颈）。
  buffer_size: 500000
  #   原 20000 → 500000：**本次性价比最高的改动**。内存配额 60 GiB 只用 4.7 GB，
  #   50 万条约 125 MB，近乎免费。原值在 c80 就顶满，之后每条新样本被重放约
  #   64 次（64 条新经验换 16 次更新 × batch 256）—— 这是 loss 发散的直接机制；
  #   放大后重放比降到约 2.5×。
  eps_start: 1.0
  eps_end: 0.01
  eps_decay: 0.995
  target_sync_steps: 100
  # BC 锚定（信任域）权重：在 TD loss 上加 ‖Q(s,·) − Q_ref(s,·)‖²，
  # Q_ref 为 BC 预训练/本阶段起点的**冻结**拷贝（train_ns3 载入权重后冻结）。
  # 治「约 c100 达峰后 Q(HO) 下漂 → 快照不切 → HO 样本更少 → 进一步压低」
  # 的自强化坍缩。0 = 关闭。
  bc_anchor_w: 0.02
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0
  per_epsilon: 1.0e-6
  # n 步回报（设计方案 §4.3 P2）。NS-3 侧切换中断 12-40ms + 切换后信道需
  # 数步才稳定，信用分配链更长，故 n 步回报在这里比 Python 侧更有价值。
  # 1 = 关闭。Stage2 并行采集时 episode 边界由 ParallelCollector 的
  # EPISODE_END 哨兵通知主线程刷新窗口。
  # 3 → 8：诊断显示「切错 → SINR 崩到 -24dB → RLF」跨几十步，n=3 只能把
  # 后果回传 3 步，Q 学不到切错的代价。放大到 8 覆盖约 0.8s 的因果链
  # （γ^n 的 bootstrap 折扣已修正，放大不会引入系统性高估）。
  n_step: 8

# A3 教师（采集示范 / 退化对比 / 评估基线）——**必须与 eval_*.yaml 同口径**。
#
# 2026-09-17 关键修复：ns3.yaml 此前没有这段，Baseline 走默认（TTT 320ms、
# L3 α=0.4）。高铁 83m/s 下 320ms ≈ 26m，且 L3 滤波把洞口 raw +4dB 滤成
# 约 -7dB → **TTT 从未启动，教师切不进洞内微站**，采集的示范全是「进洞即死」
# 轨迹（标定实测 tunnel 族存活率 0/3）。而 eval_tunnel.yaml 用的是洞口调参
# 版本（40ms/α=1.0/raw_enter），所以评估侧 A3 能跑满 480 步 —— 训练/评估
# 教师口径不一致，是比「场景太难」更根本的缺陷。
a3_operator:
  hyst_db: 2.0
  ttt_ms: 40
  a3_offset_db: 3.0
  doppler_adaptive: true
  l3_alpha: 1.0
  raw_enter: true

hybrid:
  ode_steps: 8
  ode4_hidden: 32

# 网络构造参数（顶层 net_kwargs，所有网络工厂共享签名；不用的键被忽略）。
# 必须与 Stage1 BC 预训练（configs/hsr_load.yaml 的 net_kwargs）保持一致，
# 否则 bc_init.pt 的 state_dict 加载到 Stage2 时网络结构不匹配会报错。
net_kwargs:
  ode_steps: 2      # 每个 env 步(100ms)内部 RK4 子步数（Stage1 用 2）
  ode_hidden: 64    # ODE 隐层宽度（Stage1 用 64；注意不是 hybrid.ode4_hidden）
  dt_s: 0.1

training:
  # 注意：Stage2 的「集数」实际是**学习周期数**（train_ns3.py 每个 cycle
  # drain 一次 outbox 再 learn K 次），不是采集回合数。100 cycles 只对应
  # 约 3800 transitions / 11 集实际经验，属严重欠训练（c100 eval R=-336、
  # outage=1）。这里放大到 1200 cycles ≈ 2 万 learn 步，墙钟约 1.5-2h。
  n_episodes: 1200
  # 真正的训练量口径：环境交互步数。cycle 只是节拍器（1200 cycles 实测
  # 只攒到 66 集/19.6k 步），用它当预算会严重误判训练量。两者取先到者。
  budget_env_steps: 140000
  warmup_steps: 3
  checkpoint_dir: checkpoints_stageH13
  checkpoint_freq: 10
  # ⚠ 这两个键**代码并不读取**（train_ns3.py 只用 CLI 的 --init / --anchor-init），
  # 在此纯作记录 —— 但必须记对，否则会误导启动（2026-09-24 修正）。
  # 旧值 checkpoints_ns3/bc_init.pt 是**14 维基础口径**的早期 BC（实测
  # shared.0.weight=(128,14)），与本阶段 obs_dim=28 不兼容：agent.load 是 strict
  # 加载，照它跑会直接 shape mismatch 崩。
  init_ckpt: checkpoints_stageH8/best.pt          # 训练起点（--init）
  # ⚠ 本阶段的核心改动：锚点与起点**对齐**（H10 用的是 G4 bc_init，比起点差）
  anchor_init: checkpoints_stageH8/best.pt        # 冻结锚点（--anchor-init）
  # 同上：16 → 32，把闲置的 DCU 算力用起来（目标利用率 20-40%）
  learn_steps_per_cycle: 16   # 每个学习周期连续 learn 次数
  target_sync_every: 100      # 每多少 learn step 同步目标网
  # 内联评估开销核算（2026-09-24 实测校准）：改到 load 族 + 2 集后，按
  # ~6 min/集估算 ⇒ 一次评估 ~12 min。50 → 200 cycles（约 6 次监控点）
  # ⇒ 评估总开销 ~72 min，约占 3 h 预算的 40%，可接受。
  # ⚠ cycles 现在是**数据驱动计数器**（见 learn_min_new_transitions）：1200 cycles
  # 在 50 trans/s 下约对应 28 min 纯训练，故评估已成为主要开销项 —— 再调小时
  # 必须重新核算（教训：评估族/频次由预算反推，不能凭"监控点密度"直觉定）。
  eval_every_cycles: 200      # 多少学习周期做一次 eps=0 评估
  eval_device: cuda:1         # 评估设备（单卡回退 cuda:0）
  # 单次内联评估的硬上限（秒；0 = 不限制，旧行为）。评估是**监控手段**，不能
  # 反过来把训练主循环无限期堵死 —— cmd_0173 的 c50 评估独占 85 min 就是反例。
  # 超时则放弃本次评估：不更新 best.pt、不计 no_improve（避免把"跑不完"误判成
  # "没进步"而提前早停），训练继续。
  # 按 normal 族 + 6 路采集（留 1 核给评估环境）估：单集约 1~2 min、2 集约 4 min
  # ⇒ 900 s 留 3 倍以上余量。
  # ⚠ 前两次设 900/1200 s 都按"单集 6~8 min"的直觉估，而实测 congested 是 22 min/集
  # ⇒ 评估必然超时被放弃 ⇒ 永远没有 best.pt。教训：评估预算要用**实测步速**反推。
  # 现在有 cmd_0176 做实测校准，且守护会兜底（超时放弃而非堵死训练）。
  eval_timeout_s: 900
  min_buffer_before_learn: 256
  # ---- 数据耦合的 learn 门禁（2026-09-24 新增，治「池子冻结还在学」）----
  # H9 实测：buffer 在 c80 撞满 20000，之后 20 路采集器因重族长 episode 呈脉冲式
  # 到货（c165→c200 仅新增 302 条），主循环却仍每 cycle 做 8 次 learn ⇒ 对同一批
  # 样本反复迭代，loss_ema 0.38→9.3 发散、DCU 利用率仅 0.2%。设为 64 后：累计
  # 新增经验不足 64 条就不更新（跨 cycle 累加，不会饿死学习），把 CPU 让给采集。
  # 0 = 关闭该门禁（旧行为）。
  learn_min_new_transitions: 64
  # 早停：连续 N 次内联评估无改进即收口（0 = 关闭）。
  # 依据：在线微调不单调变好（C4 实测 c50~c200 全 out=0.0，c250 起退化为
  # ho=0）。跑过峰值只浪费墙钟且最终产物更差；峰值快照由 best.pt 保留。
  early_stop_patience: 4

eval:
  # 训练内联评估仅用于监控曲线 + best.pt 择优；正式对比用
  # scripts/eval_ns3.py / path_probe 跑同 seed 配对 + 动作分布统计。
  # 4 → 2（2026-09-24）：内联评估**串行在主线程**，每集数分钟，4 集会把评估
  # 开销推到预算的 1.5 倍以上。降噪不做在这里 —— 内联评估只需能识别"ho=0 退化"
  # 这类**定性崩坏**（这是 best.pt 择优机制存在的理由），精细对比交给外部探针。
  n_episodes: 2
  # 评估步数上限（0 = 不截断，跑满整集）。240 → 0（2026-09-25 回退）：
  # 当初截断是因为评估族误取 congested（22 min/集）。现改回 normal（n_bg_ue
  # [0,8]、无隧道，单集成本低得多），可以跑满整集 —— **这点很重要**：截到 240 步
  # 只覆盖约 2 km，RLF（需连续 3 步 SINR < -6 dB）几乎不会触发 ⇒ `out` 恒定 0，
  # best.pt 的择优判据 (outage, -reward) 退化成只看 reward。
  max_steps: 0

collector:
  # ⚠ 20 → 6（2026-09-25）。上面那段"容器 32 核"的判断是错的：`nproc` 可见 32 核，
  # 但 **cgroup CPU 配额只有 7 核**（cpu.max = 700000/100000）。20 路 ns-3 是 2.9×
  # 超额订阅 ⇒ 每路被限流到 ~0.35 核（实测每路 %CPU≈35%、且全部处于 R 态），
  # 于是**单集墙钟从 ~2.6 min 拖到 ~7.4 min**，learn 反馈慢 3 倍，评估也被拖死。
  # 改 6 路：每路近 1 核，留 1 核给主线程（drain/learn/评估环境）。
  # 吞吐代价：由于 CPU 总量固定，trans/s 基本不变（~18.5 vs ~21.6，约 -15%），
  # 但**单集延迟降到约 2.6 min**，样本反馈与评估都随之变快。
  # ⚠ 该判断依赖"ns-3 是 CPU 密集且被限流"；若实测单集延迟未降到 ~2.6 min，
  # 说明判定有误，应回调（验收方法见 cmd_0176）。
  n_collectors: 6              # 6 路 NS-3 并行（每路单线程仿真；配额 7 核）
  # mixed：A3 教师与 RL 自身策略（网络快照）共同产出经验。纯 a3 采集时
  # buffer 里 100% 是教师动作，RL 只能克隆 A3、无法发现更优决策（Stage2
  # 第一轮实测：HO 次数/std 与 A3 完全一致，RL 无区分度）。
  collect_policy: mixed
  # frac=0.5/eps=0.2 首轮实测：快照自由跑比例过高，BC 策略在自致状态分布上
  # 复合偏移，episode 大量 RLF 早停（3790 trans/53 集，均值 71 步/集），
  # 训练后 5/10 集切弱小区 RLF。降到 0.3/0.1：教师主导轨迹、探索仍入 buffer。
  mixed_bootstrap_frac: 0.1    # 走网络快照的概率（其余走 A3 教师）
  mixed_eps: 0.1               # 快照动作中的 ε-随机探索率（纯贪心快照只会复刻自身）
  snapshot_every_steps: 200    # 每多少个 **learn step** 把 online 网权重同步给 collector 的 CPU 快照（单位是 learn steps，非 cycle）

ns3:
  # 云端海光 DCU 环境实际路径（wrapper 已设 LD_LIBRARY_PATH=.../build/lib）
  binary: /work/home/<HPC_ACCOUNT>/ns3root/run_hsr.sh
  cwd: /work/home/<HPC_ACCOUNT>/ns3root/ns-3.43
  # {rng_run} 会被每 episode 的种子替换
  # 射频参数显式对齐 spec：20MHz/43dBm/7dB/band1(2.1GHz)
  args: "--nEnb=8 --spacing=1000 --offset=50 --speed=83.3 --dur=52 --dt=0.1 --cbrRate=20 --dlRb=100 --txPowerDbm=43 --ueNoiseFigure=7 --earfcn=100 --rngRun={rng_run}"
  timeout_s: 600
  scenario:
    randomize: true
    n_bg_ue: [24, 48]          # 背景高速 UE 数区间（共站负载）
    bg_speed_mps: [83, 138]    # 300-500 km/h
    bg_spawn_s: 6000.0         # 背景 UE 初始纵向散布 m
    bg_cluster_frac: [0.0, 0.6] # 聚集慢行 UE 比例区间（扎堆偶数号小区→非均匀负载，
                                # 偶数站拥塞/奇数站空闲；RL 可学切向空闲次强小区，
                                # A3 的 RSRP 贪心学不会负载分流）
    voip_frac: [0.15, 0.30]    # VoIP(QCI1 GBR) 比例区间
    video_frac: [0.30, 0.50]   # 视频/eMBB(QCI6/9) 比例区间
    tunnel_loss_db: [20, 25]   # 宏站穿洞额外路损 dB（上限对齐 eval_tunnel 的 25）
    # v2 洞内微站（漏缆近似）：微站↔洞内 UE 只加 3dB 耦合衰减，洞内有覆盖，
    # A3 教师洞内可存活 → 隧道重新纳入训练分布（randomize 路径每段 p=0.6
    # 保留，见 ns3_env.py build_scenario_args）。
    # 2026-09-17 标定：按**已验证可存活**的 eval_tunnel 取值对齐（原
    # 250m/30dBm/3dB 组合下 A3 教师 3/3 全灭在进洞处）。
    tunnel_enb_spacing_m: 200.0
    tunnel_enb_tx_dbm: 33.0
    tunnel_micro_loss_db: 0.0
    tunnels:
      - [2000, 2800]
      - [5000, 5600]

  # ---- 场景族（课程化）----
  # 只覆盖「难度维度」（背景 UE 数 / 聚集比例 / 隧道有无），拓扑与射频继承
  # 基础 scenario。enabled=false 的族不入训练池：2026-09-17 标定实测
  # congested 族 A3 教师 4/4 全灭（258/480 步、outage=1.0、R=14.5±13.8），
  # 对规则策略都不可存活 → 不能作为训练分布（RL 得不到正样本）。
  # 定期重跑 scripts/calibrate_scenes.py 复核（微站/负载参数变更后必跑）。
  scenario_families:
    normal:
      randomize: true
      n_bg_ue: [0, 8]
      bg_cluster_frac: [0.0, 0.0]
      tunnels: []
    tunnel:
      randomize: true
      weight: 0.3
      n_bg_ue: [0, 8]
      bg_cluster_frac: [0.0, 0.0]
      tunnels: [[2000, 2800], [5000, 5600]]
      # 教师口径修复（TTT 40ms/α=1.0/raw_enter）+ 微站参数对齐后重标定：
      # survival 1.00、480/480 步、R=476.3 → 重新入池
    load:
      randomize: true
      n_bg_ue: [16, 48]
      bg_cluster_frac: [0.0, 0.3]
      tunnels: []
    congested:
      randomize: true
      weight: 0.25
      n_bg_ue: [32, 64]
      bg_cluster_frac: [0.0, 0.6]
      tunnels: [[2000, 2800], [5000, 5600]]
      # 教师口径修复后重标定：survival 1.00、480/480、R=394.5 → 重新入池
    # ---- 冷热对族（S2）----
    # 存在的理由：congested 族里「更空闲的邻区」同时就是「更弱的邻区」，
    # 实测负载项只会让 RL 少切换并掉话（存活 1.00 → 0.33、切换 7.33 → 2.67/集）。
    # 给冷（奇号）宏小区加 6dB Tx 功率后，空闲邻区同时满足 RSRP 门限，
    # 「切向空闲小区」才成为不牺牲覆盖的逃逸路径 —— 负载均衡在此族才可学。
    hotcold:
      randomize: true
      weight: 0.15
      n_bg_ue: [32, 64]
      bg_cluster_frac: [0.5, 0.6]
      tunnels: []
      cold_neighbor_boost_db: 6.0
    # ---- 高速快衰落族（对照实验用）----
    # 与 normal 同参数，但开启 Jakes 快衰落（多普勒）：用于检验「教师/RL 的
    # 结论在真实快衰落下是否仍成立」。NS-3/LENA 默认无快衰落，既有全部结论
    # 都是在**过于干净**的信道下得到的，这是一个必须量化其影响的风险项。
    fading:
      enabled: false
      randomize: true
      n_bg_ue: [0, 8]
      bg_cluster_frac: [0.0, 0.0]
      tunnels: []
      fast_fading: true
      fc_hz: 2.12e9
      jakes_n: 34

# 课程：训练池 = 所有 enabled 族（ParallelCollector 均匀采样）；
# 内联评估固定在代表族上，不与训练随机化纠缠（正式对比走 eval_ns3）。
curriculum:
  order: [normal, tunnel, load, congested]
  # eval_family 必须**既有压力、又跑得起**（2026-09-24 二次修正）。
  #
  # ① 为什么不能是 normal：docs P8 —— 轻载场景（n_bg_ue [0,8] + 无隧道）RL 与
  #    A3 决策完全重合、指标 14 位小数相同 ⇒ 该族**无法区分任何策略**。H9 实为
  #    此坑：c50~c250 六次 eval 逐位相同（tp=9.94/ho=4.0/out=0.0/R=26.0），
  #    best.pt 只在 c50 更新一次，选优与早停判据同时失效。
  #
  # ② 中间一度改成 congested / load，**现已回退到 normal**（2026-09-25 再修正）。
  #    改走的理由是先前的"轻载族无法区分策略"（P8）**论据不成立**：
  #      - P8 的测量全部用饱和源 CBR=100，而文档**修正 B** 已推翻它；反证就在
  #        S2 矩阵里 —— **M4（轻载、CBR=20）区分度 +18.7%**；
  #      - 更直接：**H8 在同一 normal 族上的 eval 明显变化**
  #        （tp 33.33/33.35/32.64/33.14，R 34.8/35.0/26.3/21.1）⇒ 该族不盲。
  #    所以 H9 的六次 eval 逐位相同是「策略没动」，不是「评估盲」；为此改评估族
  #    反而引入了成本爆炸（congested 实测 22 min/集）与两次重启。
  #
  # ⚠ 教训（写进配置以免重犯）：
  #    (a) 改评估族必须同时核算「单集墙钟 × 集数 × 次数」是否塞得进预算；
  #    (b) **引用历史结论前先核它是否已被后续修正推翻**（P8 已被修正 B 推翻）。
  #
  # 回退到 normal 还额外省钱：n_bg_ue [0,8] + 无隧道 ⇒ 单集仿真成本远低于
  # load[16,48] / congested[32,64]，在 7 核配额下这一点很关键。
  eval_family: normal

# 奖励基线折算（方案 §5.4）：r_tp = log1p(tp) − log1p(baseline)。
# 由 scripts/calibrate_scenes.py --write 产出（configs/scene_baseline.json）
# 后同步；0/缺省 = 不折算（保持原口径）。
# ⚠ 单位：对数域均值 mean(log1p(tp))，与奖励项 r_tp=log1p(tp) **同域**。
# 用线性 Mbps 均值做基线会每步扣掉一个巨大常数（实测让 A3 存活集 R 从
# +500 变成 -331），使「早死(RLF 封顶 -70)」比「活到最后」更划算 → 激励倒挂。
# 当前置空（= 不折算，保持原口径），待标定脚本输出 log_tp_mean 后填入。
reward_baselines:
  # 2026-09-17 第三轮标定（教师口径修复后，configs/scene_baseline_r3.json）
  # 仅用于 tp_baseline_mode=family 或 episode 模式的**预热期**。
  normal: 2.117
  tunnel: 2.093
  load: 1.873
  congested: 1.752

# 吞吐基线的取法（G-Dyn3 实测驱动）：
#   family  = 族平均（族内仍有 0~32 背景 UE 差异 → 观测→回报一对多）
#   episode = 用本集开局 warmup 步估计本集吞吐水平后冻结（同一集内为常数偏移，
#             不改变该集最优策略，只消除跨集偏移 → 压低 TD 目标方差）
tp_baseline_mode: episode
tp_baseline_warmup_steps: 40
# 吞吐平滑窗口（步）。实测 EMA(10) 把奖励项 std 从 1.90 降到 0.53；
# 延迟约 0.5s，与 3~6s 的决策视野兼容。0 = 不平滑。
tp_smooth_k: 10
